apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgres-wireguard
  namespace: issues
  labels:
    kubernetes.io/service-name: postgres
    endpointslice.kubernetes.io/managed-by: cluster-admins
addressType: IPv4
ports:
  - name: postgres
    protocol: TCP
    port: 5432
endpoints:
  - addresses:
      - "10.200.29.1"
    conditions:
      ready: true