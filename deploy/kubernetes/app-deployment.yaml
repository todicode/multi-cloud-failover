apiVersion: apps/v1
kind: Deployment
metadata:
  name: issues-app
  namespace: issues
spec:
  replicas: 1
  selector:
    matchLabels:
      app: issues-app
  template:
    metadata:
      labels:
        app: issues-app
    spec:
      containers:
        - name: app
          image: ghcr.io/todicode/multi-cloud-failover@sha256:2d7cf831e50eb1c693082dc9e4f7dbf76ded557fa512a249ba68df7995b6b10e
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: issues-app-config
            - secretRef:
                name: postgres-auth
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/database/status
              port: http
            periodSeconds: 5
            timeoutSeconds: 5